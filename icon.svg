<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Outer Mathematical Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="24 16" opacity="0.4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  
  <!-- Stylized Sigma / Math Glyphs -->
  <g filter="url(#glow)">
    <!-- Stylized Delta / Triangle in Center -->
    <path d="M256 120 L380 340 L132 340 Z" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Golden Core Point -->
    <circle cx="256" cy="256" r="22" fill="#38bdf8" />
    <circle cx="256" cy="256" r="10" fill="#ffffff" />
  </g>
  
  <!-- Orbiting Subgroups Points -->
  <circle cx="256" cy="96" r="12" fill="#a855f7" />
  <circle cx="395" cy="340" r="12" fill="#6366f1" />
  <circle cx="117" cy="340" r="12" fill="#38bdf8" />
</svg>
